<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>User Profile</h1>
    <p class="description">Enter your profile details and add your hobbies.</p>

    <form id="profileForm">
      <label for="username">
        Name
        <input id="username" type="text" placeholder="For example, Anna" required>
      </label>

      <label for="birthYear">
        Birth Year
        <input id="birthYear" type="number" placeholder="For example, 2002" required>
      </label>

      <button type="submit">Create or Update Profile</button>
    </form>

    <p id="profileInfo" class="profile-info" aria-live="polite"></p>

    <h2>My Hobbies</h2>
    <ul id="hobbiesList"></ul>

    <div class="hobby-form">
      <input id="newHobby" type="text" placeholder="Enter a new hobby">
      <button id="addItemButton" type="button">Add</button>
    </div>

    <button id="removeItemButton" class="remove-button" type="button">
      Remove Last Hobby
    </button>
  </main>
</body>
</html>
